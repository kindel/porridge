name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the Python tests
        run: python3 -m unittest discover -s tests -v

      # {lp:} token expansion, lifted from js/porridge-app.js so the check
      # cannot drift from what the page actually runs.
      - name: Check token expansion
        run: node scripts/check_tokens.js

      # The Hugo partial is the page path. Render it and require an escaped
      # note plus a real {lp:} link.
      - name: Install Hugo
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz \
            https://github.com/gohugoio/hugo/releases/download/v0.143.1/hugo_extended_0.143.1_linux-amd64.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
      - name: Check escaped reading notes
        run: HUGO=/tmp/hugo node scripts/check_lp_html.js
