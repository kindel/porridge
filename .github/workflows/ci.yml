name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the Python tests
        run: python3 -m unittest discover -s tests -v

      # {lp:} token expansion, lifted from js/porridge-app.js so the check
      # cannot drift from what the page actually runs.
      - name: Check token expansion
        run: node scripts/check_tokens.js
