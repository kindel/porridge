name: Generate facet examples

# Manual only. Every real run spends xAI credits, so this is never on push
# and never on a schedule. Resume-safe: writes a generated set onto every
# facet that does not already have one. Human source refs are not a skip.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what it would cost and write nothing
        required: true
        default: true
        type: boolean
      facet:
        description: Facet id to generate, or empty for every facet still missing a generated set
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: porridge

      - uses: actions/checkout@v4
        with:
          repository: kindel/principles
          path: principles

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PORRIDGE_DRY_RUN: ${{ inputs.dry_run }}
          PORRIDGE_FACET: ${{ inputs.facet }}
          PRINCIPLES_ROOT: ${{ github.workspace }}/principles
        shell: bash
        working-directory: porridge
        run: |
          set -o pipefail
          python3 scripts/generate.py | tee run.log

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### Facet examples"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run. Nothing was generated and no credits were spent."
              echo
            fi
            echo '```'
            tail -n 20 porridge/run.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload facets.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facets
          path: principles/data/facets.json
          if-no-files-found: ignore

      - name: Open a pull request on kindel/principles
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v6
        with:
          path: principles
          token: ${{ secrets.CASCADE_TOKEN }}
          branch: generated/facet-examples
          delete-branch: true
          add-paths: data/facets.json
          commit-message: Generate facet calibration rows.
          title: Generated facet calibration rows
          body: |
            Generated by kindel/porridge `Generate facet examples`.

            Generated calibration for the porridge table. Human Amazon and
            Dawn rows stay on records as source. This PR only adds inline
            `words: generated` rows on facets.

            Review before merging. The usual failure is a row that sounds
            like a slogan instead of a week of work.
