name: Sync from principles

on:
  repository_dispatch:
    types: [cascade]
  workflow_dispatch:

concurrency:
  group: cascade-principles
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync stubs
        run: python3 scripts/sync_from_principles.py
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: cascade/principles
          delete-branch: true
          add-paths: |
            content/porridge
            .kindel/last-sync.txt
          commit-message: Sync Porridge pages with principles.
          title: Sync Porridge pages with principles
          body: |
            Stubs synced from `kindel/principles` so each principle has a URL.

            New principles gain a stub; a stub whose record was renamed or
            removed upstream is deleted, because a stale stub fails the whole
            site build. Existing pages that still match a record are left
            alone. Company indexes stay unrendered. Calibration still comes
            from the principles module at site-pin time.

            See `.kindel/last-sync.txt` for the SHA this ran against and what
            was added or removed.
